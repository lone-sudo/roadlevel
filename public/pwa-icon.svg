<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.4"/>

  <!-- Perspective Road -->
  <polygon points="190,140 322,140 430,460 82,460" fill="url(#road)"/>

  <!-- Road Dashed Centreline -->
  <line x1="256" y1="160" x2="256" y2="200" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="230" x2="256" y2="280" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="315" x2="256" y2="385" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="420" x2="256" y2="460" stroke="#f59e0b" stroke-width="20" stroke-linecap="round"/>

  <!-- Crosshairs / Survey Reticle -->
  <circle cx="256" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="180" r="6" fill="#38bdf8"/>
  <line x1="140" y1="180" x2="372" y2="180" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
  <line x1="256" y1="70" x2="256" y2="290" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>

  <!-- Dumpy Level Optical Telescope Silhouette -->
  <path d="M160,165 L352,165 L368,155 L375,155 L375,205 L368,205 L352,195 L160,195 L144,205 L135,205 L135,155 L144,155 Z" fill="url(#gold)"/>
  <!-- Focus knob -->
  <rect x="240" y="142" width="32" height="18" rx="4" fill="#fde68a"/>
  <!-- Tripod Head -->
  <rect x="236" y="200" width="40" height="15" rx="3" fill="#94a3b8"/>
  <line x1="240" y1="215" x2="195" y2="300" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="215" x2="256" y2="305" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="272" y1="215" x2="317" y2="300" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
</svg>
